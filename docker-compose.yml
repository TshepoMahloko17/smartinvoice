services:
  db:
    image: postgres:16-alpine
    container_name: smartinvoice-db
    environment:
      POSTGRES_DB: SmartInvoiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartinvoice-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=SmartInvoiceDb;Username=postgres;Password=postgres"
      Jwt__SecretKey: "SmartInvoice_Local_Dev_Secret_Key_Change_In_Prod!!"
      Jwt__Issuer: SmartInvoice
      Jwt__Audience: SmartInvoiceClient
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/smart-invoice-ui
      dockerfile: Dockerfile
    container_name: smartinvoice-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
